name: Checks

# Runs the API tests and makes sure every deployable image still builds.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: tabledash, POSTGRES_PASSWORD: tabledash, POSTGRES_DB: tabledash }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tabledash" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://tabledash:tabledash@localhost:5432/tabledash
      JWT_SECRET: test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  images-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: API image
        run: docker build -f apps/api/Dockerfile -t check-api .
      - name: Restaurant back office image
        run: docker build -f apps/restaurant/Dockerfile --build-arg NEXT_PUBLIC_API_URL=https://api.example.com -t check-office .
      - name: Admin console image
        run: docker build -f apps/admin/Dockerfile --build-arg NEXT_PUBLIC_API_URL=https://api.example.com -t check-admin .
      - name: API image starts
        run: |
          docker network create t
          docker run -d --name db --network t -e POSTGRES_USER=td -e POSTGRES_PASSWORD=td -e POSTGRES_DB=td postgres:16
          sleep 8
          docker run -d --name api --network t -p 4000:4000 \
            -e DATABASE_URL=postgresql://td:td@db:5432/td -e JWT_SECRET=x -e SHOW_DEV_OTP=true check-api
          for _ in $(seq 1 30); do curl -sf localhost:4000/health && exit 0; sleep 3; done
          docker logs api; exit 1

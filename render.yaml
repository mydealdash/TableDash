# Render Blueprint: one click deploys the database, API, restaurant app, admin console
# and the diner app (web build) for testing. https://render.com/docs/blueprint-spec
databases:
  - name: tabledash-db
    plan: free
    databaseName: tabledash
    user: tabledash

services:
  - type: web
    name: tabledash-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w apps/api
    startCommand: cd apps/api && npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase: { name: tabledash-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: PLATFORM_FEE_BPS
        value: 200
      - key: NOTIFY_PRIORITY_WINDOW_SECONDS
        value: 120
      - key: PARTNER_KEYS
        value: demo-partner:demo-partner-key
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: tabledash-restaurant
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w apps/restaurant
    startCommand: cd apps/restaurant && npx next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_API_URL
        fromService: { type: web, name: tabledash-api, property: host }

  - type: web
    name: tabledash-admin
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w apps/admin
    startCommand: cd apps/admin && npx next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_API_URL
        fromService: { type: web, name: tabledash-api, property: host }
      - key: NEXT_PUBLIC_RESTAURANT_APP_URL
        fromService: { type: web, name: tabledash-restaurant, property: host }

  - type: web
    name: tabledash-diner
    runtime: static
    rootDir: apps/mobile
    buildCommand: npm ci && npx expo export --platform web --output-dir dist
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: EXPO_PUBLIC_API_URL
        fromService: { type: web, name: tabledash-api, property: host }

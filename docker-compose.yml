# Local stack: Postgres + API + restaurant app + admin console.
# The diner mobile app runs separately with Expo (see README).
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: tabledash, POSTGRES_PASSWORD: tabledash, POSTGRES_DB: tabledash }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U tabledash"], interval: 3s, retries: 20 }
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql://tabledash:tabledash@db:5432/tabledash
      JWT_SECRET: change-me-in-production
      PORT: 4000
      PLATFORM_FEE_BPS: 200
      NOTIFY_PRIORITY_WINDOW_SECONDS: 120
      PARTNER_KEYS: demo-partner:demo-partner-key
    ports: ["4000:4000"]
    depends_on: { db: { condition: service_healthy } }
  restaurant:
    build: { context: ., dockerfile: apps/restaurant/Dockerfile, args: { NEXT_PUBLIC_API_URL: http://localhost:4000 } }
    ports: ["3001:3001"]
    depends_on: [api]
  admin:
    build: { context: ., dockerfile: apps/admin/Dockerfile, args: { NEXT_PUBLIC_API_URL: http://localhost:4000, NEXT_PUBLIC_RESTAURANT_APP_URL: http://localhost:3001 } }
    ports: ["3002:3002"]
    depends_on: [api]
volumes: { pgdata: {} }
